<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Secure Login System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <main class="auth-shell">
        <header class="brand-header">
            <div class="brand-badge" aria-hidden="true">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
            </div>
            <h1>Secure Login System</h1>
            <p class="subtitle">Create your account to access your secure workspace</p>
        </header>

        <section class="auth-card" aria-labelledby="registerHeading">
            <div class="card-header">
                <h2 id="registerHeading">Create account</h2>
                <p>Enter your details below to get started</p>
            </div>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="name">Full name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Jane Doe"
                        autocomplete="name"
                        enterkeyhint="next"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="username"
                        spellcheck="false"
                        enterkeyhint="next"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a strong password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="72"
                        aria-describedby="passwordHint"
                        enterkeyhint="next"
                        required
                    >
                    <span id="passwordHint" class="field-hint">Must be at least 8 characters.</span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        minlength="8"
                        maxlength="72"
                        enterkeyhint="done"
                        required
                    >
                </div>

                <button type="submit" id="registerBtn" class="btn-primary">Register</button>
            </form>

            <p id="message" class="status-message" role="status" aria-live="polite"></p>

            <p class="auth-footer">
                Already have an account?
                <a href="login.html">Sign in</a>
            </p>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
